<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>website rahasia</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#080808;color:white;font-family:Arial,sans-serif;text-align:center}
.container{padding:25px}
h1{font-size:35px;margin-bottom:15px}
p{color:#aaa;margin-bottom:25px}
button{padding:16px 25px;border:none;border-radius:12px;background:#675cff;color:white;font-size:17px;font-weight:bold;cursor:pointer;transition:.2s}
button:active{transform:scale(.95)}
#prankScreen{display:none;position:fixed;inset:0;background:#000;justify-content:center;align-items:center;flex-direction:column;z-index:999}
#warning{font-size:23px;margin-bottom:25px;color:#ff5555;animation:warningPulse .8s infinite}
#countdown{font-size:110px;font-weight:bold;animation:countdownZoom 1s ease}
.countdownEffect{animation:countdownZoom .9s ease}
#prankText{display:none;font-size:50px;font-weight:bold;animation:prankShake .12s infinite}
#subText{display:none;margin-top:20px;color:#aaa;font-size:18px}
@keyframes warningPulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes countdownZoom{0%{transform:scale(2);opacity:0}40%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes prankShake{0%{transform:translate(0)}25%{transform:translate(8px,-5px)}50%{transform:translate(-8px,5px)}75%{transform:translate(5px,8px)}100%{transform:translate(0)}}
.flash{animation:flashEffect .25s}
@keyframes flashEffect{0%{background:#000}50%{background:#fff}100%{background:#000}}
.finalEffect{animation:finalZoom .6s ease}
@keyframes finalZoom{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
</style>
</head>
<body>

<div class="container">
<h5>@rizky owner</h5>
<br><hr><br>
<h1>tolong bantu pencet</h1>
<p>website pertama saya</p>
<button onclick="startPrank()">PENCET DI SINI!</button>
</div>

<div id="prankScreen">
<div id="warning">⚠️ PERINGATAN! ⚠️<br><br>HP ANDA AKAN DIRETAS!</div>
<div id="countdown">3</div>
<div id="prankText">🤣 KENA PRANK!</div>
<div id="subText">Tenang... HP kamu aman 😂</div>
</div>

<script>
function beep(frequency=600,duration=150){
  try{
    const AudioContext=window.AudioContext||window.webkitAudioContext;
    const audio=new AudioContext();
    const oscillator=audio.createOscillator();
    const gain=audio.createGain();
    oscillator.type="sine";
    oscillator.frequency.value=frequency;
    gain.gain.setValueAtTime(.15,audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration/1000);
    oscillator.connect(gain);
    gain.connect(audio.destination);
    oscillator.start();
    oscillator.stop(audio.currentTime+duration/1000);
  }catch(error){console.log("Audio tidak tersedia")}
}

function startPrank(){
  const screen=document.getElementById("prankScreen");
  const warning=document.getElementById("warning");
  const countdown=document.getElementById("countdown");
  const prankText=document.getElementById("prankText");
  const subText=document.getElementById("subText");

  screen.style.display="flex";
  warning.style.display="block";
  countdown.style.display="block";
  prankText.style.display="none";
  subText.style.display="none";
  prankText.classList.remove("finalEffect");

  let number=3;
  countdown.textContent=number;
  beep(500,180);

  const timer=setInterval(()=>{
    number--;

    if(number>0){
      countdown.textContent=number;
      countdown.classList.remove("countdownEffect");
      void countdown.offsetWidth;
      countdown.classList.add("countdownEffect");
      beep(500+((3-number)*150),180);
    }else{
      clearInterval(timer);
      warning.style.display="none";
      countdown.style.display="none";
      screen.classList.add("flash");

      setTimeout(()=>{
        screen.classList.remove("flash");
      },250);

      beep(900,250);

      setTimeout(()=>{
        prankText.style.display="block";
        subText.style.display="block";
        prankText.classList.add("finalEffect");
      },200);
    }
  },1000);
}
</script>
</body>
</html>
